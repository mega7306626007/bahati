# Single source of truth for every dependency version in PesaFlow-test.
# Bump here; every module follows. No more version drift between files.
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
kover = "0.9.0"
coreKtx = "1.13.1"
lifecycle = "2.8.4"
activity = "1.9.1"
composeBom = "2024.06.00"
room = "2.6.1"
coroutines = "1.8.1"
work = "2.9.0"
mlkitText = "19.0.0"
pdfbox = "2.0.27.0"
desugar = "2.0.4"
datastore = "1.1.1"
splash = "1.0.1"
accompanist = "0.34.0"
lottie = "6.1.0"
glance = "1.1.1"
serializationJson = "1.6.3"
junit = "4.13.2"

[libraries]
