org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Faster builds: reuse task outputs + run modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# Stability on Windows: file-system watching keeps handles on freshly
# transformed files, which races artifact-transform moves (AccessDenied on
# large AARs like play-services/material3). Watching only speeds up
# up-to-date checks, so disabling is safe.
org.gradle.vfs.watch=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
